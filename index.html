<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeWeather — No Degrees. Only Vibes.</title>
<meta name="description" content="A weather app that never tells you the temperature. Real weather, translated into vibes. Powered by Open-Meteo, 100% free.">
<meta name="theme-color" content="#f2a65a">
<meta property="og:title" content="VibeWeather — No Degrees. Only Vibes.">
<meta property="og:description" content="A weather app that never tells you the temperature. Real weather, translated into vibes. Powered by Open-Meteo, 100% free.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vibeweather.pages.dev/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2218%22 fill=%22%23e9a13b%22/><g stroke=%22%23e9a13b%22 stroke-width=%224%22 stroke-linecap=%22round%22><line x1=%2232%22 y1=%226%22 x2=%2232%22 y2=%2212%22/><line x1=%2232%22 y1=%2252%22 x2=%2232%22 y2=%2258%22/><line x1=%226%22 y1=%2232%22 x2=%2212%22 y2=%2232%22/><line x1=%2252%22 y1=%2232%22 x2=%2258%22 y2=%2232%22/><line x1=%2213.9%22 y1=%2213.9%22 x2=%2218.1%22 y2=%2218.1%22/><line x1=%2245.9%22 y1=%2245.9%22 x2=%2250.1%22 y2=%2250.1%22/><line x1=%2213.9%22 y1=%2250.1%22 x2=%2218.1%22 y2=%2245.9%22/><line x1=%2245.9%22 y1=%2218.1%22 x2=%2250.1%22 y2=%2213.9%22/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="station">
  <div class="station-name">Vibe Weather Service &middot; No degrees. Only vibes.</div>
  <div class="station-controls">
    <div class="search-wrap">
      <input type="text" id="cityInput" placeholder="search a city&hellip;" autocomplete="off">
      <button id="goBtn" type="button">Go</button>
      <button id="locateBtn" type="button">&#9673; Locate</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="poster">
  <div class="motif" id="motif"></div>
  <div class="visit">Visit <span class="city" id="cityName">The Sky</span></div>
  <div class="tagline" id="tagline">WHERE THE VIBES ARE TRANSLATED</div>
  <div class="quote" id="quote"></div>
  <div class="status" id="status" hidden></div>
  <div class="credits" id="credits" hidden>
    <div class="cr"><span class="k">Sky</span><span class="v" id="skyLine">&mdash;</span></div>
    <div class="cr"><span class="k">Wind</span><span class="v" id="windLine">&mdash;</span></div>
    <div class="cr"><span class="k">Humidity</span><span class="v" id="humLine">&mdash;</span></div>
    <div class="cr"><span class="k">Precip</span><span class="v" id="precipLine">&mdash;</span></div>
  </div>
  <div class="nerds" id="nerds"></div>
</main>

<footer>
  <span id="asof" class="asof">AS OF &mdash;</span>
  <button id="copyBtn" type="button">Copy Vibe</button>
</footer>

<script src="js/engine.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
